; The API accepts files up to 5 MB, so PHP has to allow more than that:
; multipart overhead lives in post_max_size, and a request that exceeds it is
; cut off before the framework ever sees it.
upload_max_filesize = 8M
post_max_size = 12M
max_file_uploads = 20

; Decoding a 25 MP image costs around 100 MB of raw bitmap.
memory_limit = 512M
max_execution_time = 120

expose_php = Off

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
